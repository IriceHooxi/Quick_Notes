<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#fcf8ee"/>
      <stop offset="1" stop-color="#ede2cb"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d0603f"/>
      <stop offset="1" stop-color="#b2442f"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 .42  0 0 0 0 .34  0 0 0 0 .2  0 0 0 .22 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- 纸张 -->
  <g transform="rotate(-5 128 128)">
    <rect x="44" y="36" width="166" height="190" rx="20" fill="#3b2a12" opacity=".32" filter="url(#soft)" transform="translate(2 8)"/>
    <rect x="44" y="30" width="166" height="190" rx="20" fill="url(#paper)"/>
    <rect x="44" y="30" width="166" height="190" rx="20" fill="#000" filter="url(#grain)"/>
    <rect x="44.5" y="30.5" width="165" height="189" rx="19.5" fill="none" stroke="#a8946e" stroke-opacity=".35"/>
    <!-- 横线 -->
    <g stroke="#cbb994" stroke-width="6" stroke-linecap="round">
      <path d="M106 86 H184"/>
      <path d="M106 128 H178"/>
      <path d="M72 170 H132"/>
    </g>
    <!-- 勾选框 -->
    <path d="M70.5 73.5c7-.9 15.5-.8 22.6-.3.8 7 .6 15-.2 22.4-7.3.8-15.6.7-22.7.2-.8-7.2-.7-15.1.3-22.3z" fill="none" stroke="#6e6656" stroke-width="4.6" stroke-linejoin="round"/>
    <path d="M74.5 85c3 2.3 5.4 5.1 7.6 8.6 5-9.6 11.6-17.8 21-25.4" fill="none" stroke="#c2513a" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70.5 116.5c7-.9 15.5-.8 22.6-.3.8 7 .6 15-.2 22.4-7.3.8-15.6.7-22.7.2-.8-7.2-.7-15.1.3-22.3z" fill="none" stroke="#6e6656" stroke-width="4.6" stroke-linejoin="round"/>
  </g>

  <!-- 朱印 -->
  <g transform="rotate(8 184 186)">
    <rect x="146" y="148" width="80" height="80" rx="13" fill="#3b2a12" opacity=".28" filter="url(#soft)" transform="translate(1 5)"/>
    <rect x="146" y="148" width="80" height="80" rx="13" fill="url(#seal)"/>
    <rect x="153.5" y="155.5" width="65" height="65" rx="8" fill="none" stroke="#fdf3e4" stroke-opacity=".5" stroke-width="2.2"/>
    <text x="186" y="206" font-family="Noto Serif CJK SC" font-weight="bold" font-size="50" text-anchor="middle" fill="#fdf5e8">笺</text>
  </g>
</svg>
